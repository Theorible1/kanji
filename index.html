<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<title>Kanji JLPT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="nihon-192.png">
<link rel="apple-touch-icon" href="nihon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<script>/* thème appliqué avant l'affichage (pas de flash) */
try { var t = localStorage.getItem("kanjiApp.theme"); if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  if (t && t !== "futur-confort-ardoise") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body>
<div id="intro" aria-hidden="true"><img src="chargement.gif" alt=""></div>
<script>/* animation de lancement : 1,9 s, un toucher la passe */
(function () { var d = document.getElementById("intro"), fini = false;
  function fin() { if (fini) return; fini = true; d.classList.add("part"); setTimeout(function () { d.remove(); }, 300); }
  d.addEventListener("pointerdown", fin); setTimeout(fin, 1900); })();</script>
<main id="ecran"></main>
<nav>
  <button data-vue="accueil">🏠<span>Accueil</span></button>
  <button data-vue="progres">📊<span>Progrès</span></button>
  <button data-vue="acquis">🏆<span>Acquis</span></button>
  <button data-vue="options">⚙️<span>Options</span></button>
</nav>
<script src="themes.js"></script>
<script src="data.js"></script>
<script src="srs.js"></script>
<script src="app.js"></script>
</body>
</html>
